<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanOut - Control de Gastos</title>
    
    <!-- FAVICON E ÍCONOS PWA -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1R20OrU129nlZ9zE_hqRTKeM0aFKVjmSJ">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1R20OrU129nlZ9zE_hqRTKeM0aFKVjmSJ">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScanOut">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e6f7ff',
                            100: '#b3e5fc',
                            500: '#00b4d8',
                            600: '#0096c7',
                            700: '#0077b6',
                            900: '#03045e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js para el Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tesseract.js (OCR Local en el Navegador) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100 bg-slate-50 text-slate-900">
    
    <!-- BOTÓN CAMBIO DE TEMA -->
    <button onclick="toggleTheme()" class="absolute top-4 right-4 p-2.5 rounded-xl bg-slate-800 dark:bg-slate-900 border border-slate-700 shadow-md hover:bg-slate-700 text-brand-500 transition">
        <i data-lucide="sun" class="hidden dark:block w-5 h-5"></i>
        <i data-lucide="moon" class="block dark:hidden w-5 h-5"></i>
    </button>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginContainer" class="w-full max-w-md bg-slate-900 dark:bg-slate-900 bg-white rounded-3xl shadow-2xl p-8 border border-slate-800 dark:border-slate-800 border-slate-200">
        <div class="flex flex-col items-center mb-6">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center shadow-lg shadow-brand-500/20 mb-3 border border-brand-500/30 overflow-hidden">
                <img src="https://lh3.googleusercontent.com/d/1R20OrU129nlZ9zE_hqRTKeM0aFKVjmSJ" alt="ScanOut Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Scan<span class="text-brand-500">Out</span></h1>
            <p class="text-xs text-slate-500 mt-1">Control inteligente de gastos y boletas</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5 text-slate-500 dark:text-slate-400">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="userInput" required placeholder="Ingresa tu usuario"
                        class="w-full pl-10 pr-3 py-3 bg-slate-950 dark:bg-slate-950 bg-slate-100 border border-slate-800 dark:border-slate-800 border-slate-300 rounded-xl text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-500 transition text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5 text-slate-500 dark:text-slate-400">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events
